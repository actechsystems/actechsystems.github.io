<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apresentação — ACTech Informática</title>
<meta name="description" content="Apresentação da ACTech Informática para comércios de Brasília." />
<!-- Ferramenta de venda, não página de visitante. -->
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0C1424" />
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='8'%20fill='%230C1424'/%3E%3Cpath%20d='M12%2011l-5%205%205%205M20%2011l5%205-5%205'%20fill='none'%20stroke='%235E8CBA'%20stroke-width='3'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="fontes/fontes.css" />
<link rel="manifest" href="manifest.webmanifest" />
<!-- GSAP local (vendor/): a página precisa abrir sem internet, no balcão. -->
<script src="vendor/gsap-3.12.5.min.js"></script>

<style>
  /* Palco escuro: é o mesmo navy da vitrine de sistemas do site, a parte que
     mais impressiona na página inteira. Num balcão iluminado, o contraste é o
     que segura o olhar do dono. */
  :root {
    --fundo-1: #141F35;
    --fundo-2: #0C1424;
    --fundo-3: #101A31;
    --txt: #E6ECF4;
    --txt-2: #9FB0C6;
    --linha: rgba(255,255,255,.08);
    --cta: #E8690A;
    --cta-forte: #CC5200;
    --tom: #5E8CBA;
    --ease: cubic-bezier(.22,.61,.36,1);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; height: 100%;
    background: var(--fundo-2); color: var(--txt);
    font-family: "DM Sans", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    overflow: hidden;
  }

  /* ------------------------------------------------------------- palco */
  .palco {
    position: fixed; inset: 0;
    background: linear-gradient(158deg, var(--fundo-1) 0%, var(--fundo-2) 55%, var(--fundo-3) 100%);
    overflow: hidden;
  }
  .grade {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 10%, transparent 72%);
            mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 10%, transparent 72%);
  }
  /* o brilho é a cor do ramo escolhido -- a apresentação "vira" o negócio dele */
  .brilho {
    position: absolute; width: 130vmax; height: 130vmax; left: 50%; top: 40%;
    transform: translate(-50%, -50%);
    border-radius: 999px; pointer-events: none;
    background: radial-gradient(circle, color-mix(in srgb, var(--tom) 34%, transparent) 0%, transparent 58%);
  }
  .brilho-2 {
    position: absolute; width: 70vmax; height: 70vmax; right: -20vmax; bottom: -25vmax;
    border-radius: 999px; pointer-events: none;
    background: radial-gradient(circle, rgba(232,105,10,.13) 0%, transparent 62%);
  }

  /* ------------------------------------------------------- progresso */
  .topo {
    position: fixed; z-index: 20; left: 0; right: 0; top: 0;
    padding: max(14px, env(safe-area-inset-top)) 18px 0;
    display: flex; align-items: center; gap: 14px;
  }
  .barras { flex: 1; display: flex; gap: 5px; }
  .barras i { flex: 1; height: 3px; border-radius: 3px; background: rgba(255,255,255,.16); overflow: hidden; position: relative; }
  .barras i b { position: absolute; inset: 0; background: var(--txt); transform-origin: left; transform: scaleX(0); transition: transform .45s var(--ease); }
  .barras i.feita b { transform: scaleX(1); }
  .marca-mini { font-family: "Plus Jakarta Sans", sans-serif; font-weight: 800; font-size: 13px; letter-spacing: .02em; color: var(--txt-2); white-space: nowrap; }
  .marca-mini span { color: var(--txt); }

  /* ------------------------------------------------------------ telas */
  .tela {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    padding: max(56px, calc(env(safe-area-inset-top) + 44px)) 22px max(96px, calc(env(safe-area-inset-bottom) + 84px));
    visibility: hidden;
    overflow-y: auto;
  }
  .tela.on { visibility: visible; }
  .conteudo { width: 100%; max-width: 560px; margin: auto; }

  /* no PC, texto à esquerda e a peça visual à direita */
  .duas { display: grid; gap: 28px; align-items: center; width: 100%; max-width: 1140px; margin: auto; }
  @media (min-width: 900px) {
    .duas { grid-template-columns: .9fr 1.1fr; gap: 64px; }
    /* notebook + celular precisam de mais palco que texto */
    .duas.larga { grid-template-columns: .62fr 1.38fr; gap: 48px; max-width: 1280px; }
    .tela { padding-left: 60px; padding-right: 60px; }
  }

  .olho {
    display: inline-flex; align-items: center; gap: 9px;
    font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
    color: var(--tom); margin-bottom: 18px;
  }
  .olho::before { content: ''; width: 22px; height: 2px; border-radius: 2px; background: currentColor; }

  h1, h2 {
    font-family: "Plus Jakarta Sans", system-ui, sans-serif; font-weight: 800;
    letter-spacing: -.04em; line-height: 1.06; margin: 0; color: #fff;
  }
  h1 { font-size: clamp(38px, 9.5vw, 72px); }
  h2 { font-size: clamp(30px, 7.6vw, 56px); }
  .destaque { color: var(--tom); }
  .sub { margin: 16px 0 0; font-size: clamp(15.5px, 4.1vw, 20px); line-height: 1.55; color: var(--txt-2); }
  .sub strong { color: var(--txt); font-weight: 700; }

  /* palavra que sobe de dentro da linha, em vez de só aparecer */
  .palavra { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .06em; }
  .palavra > span { display: inline-block; }

  /* ---------------------------------------------------------- capa */
  .logo-grande {
    width: 74px; height: 74px; border-radius: 22px; margin: 0 auto 26px;
    display: grid; place-items: center;
    background: linear-gradient(145deg, rgba(255,255,255,.1), rgba(255,255,255,.02));
    border: 1px solid var(--linha);
    box-shadow: 0 20px 50px -18px rgba(94,140,186,.5);
  }
  .capa { text-align: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 30px; }
  .chip {
    appearance: none; cursor: pointer;
    font-family: "Plus Jakarta Sans", sans-serif; font-weight: 700; font-size: 15.5px;
    color: var(--txt); background: rgba(255,255,255,.06);
    border: 1px solid var(--linha); border-radius: 999px;
    padding: 13px 20px;
    transition: background .25s var(--ease), border-color .25s var(--ease);
  }
  .chip:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.22); }

  /* ---------------------------------------------------------- busca */
  .busca-caixa {
    display: flex; align-items: center; gap: 12px;
    background: #fff; color: #202124; border-radius: 28px;
    padding: 15px 20px; font-size: 17px; min-height: 56px;
    box-shadow: 0 18px 50px -12px rgba(0,0,0,.6);
  }
  .busca-caixa svg { flex: none; }
  .cursor-pisca { display: inline-block; width: 2px; height: 1.15em; background: #1a73e8; vertical-align: -3px; margin-left: 2px; animation: pisca 1s steps(1) infinite; }
  @keyframes pisca { 50% { opacity: 0; } }
  .resultados { display: grid; gap: 10px; margin-top: 14px; }
  .resultado {
    display: flex; align-items: center; gap: 13px;
    background: rgba(255,255,255,.96); color: #202124;
    border-radius: 16px; padding: 13px 15px;
  }
  .resultado .num { flex: none; width: 30px; height: 30px; border-radius: 999px; background: #e8f0fe; color: #1a73e8; display: grid; place-items: center; font-weight: 800; font-size: 14px; }
  .resultado b { display: block; font-size: 15.5px; }
  .resultado small { color: #5f6368; font-size: 13px; }
  .estrelas { color: #f4b400; letter-spacing: 1px; }
  .voce-nao {
    border: 2px dashed var(--cta); background: rgba(232,105,10,.1); color: var(--cta);
    border-radius: 16px; padding: 16px; text-align: center;
    font-family: "Plus Jakarta Sans", sans-serif; font-weight: 800; font-size: 16px;
  }

  /* ------------------------------------------- aparelhos em escala
     Cada aparelho é desenhado no tamanho de verdade (notebook com 1000px,
     celular com 300px) e encolhido inteiro pra caber. Assim o site lá dentro
     tem as proporções de um site real em vez de um rascunho apertado. */
  [data-escala] { position: relative; }
  .dev { position: absolute; top: 0; left: 0; transform-origin: 0 0; }

  .combo { position: relative; width: 100%; perspective: 1500px; }
  .w-lap { position: absolute !important; left: 0; bottom: 0; width: 90%; }
  .w-cel { position: absolute !important; right: 0; bottom: 0; width: 28%; z-index: 2; }
  .w-ig  { width: min(300px, 74vw); margin: 0 auto; perspective: 1400px; }

  /* notebook: 1000 x 624 */
  .lap { width: 1000px; height: 624px; }
  .lap-tela {
    position: absolute; left: 50px; top: 0; width: 900px; height: 600px;
    border-radius: 26px 26px 6px 6px; background: #0d121b; padding: 16px;
    box-shadow: 0 0 0 2px rgba(255,255,255,.1) inset, 0 70px 120px -40px rgba(0,0,0,.85),
                0 0 120px -30px color-mix(in srgb, var(--tom) 55%, transparent);
  }
  .lap-vidro { position: relative; width: 868px; height: 568px; border-radius: 8px; overflow: hidden; background: #fff; }
  .lap-barra { height: 34px; background: #eef1f5; display: flex; align-items: center; gap: 7px; padding: 0 14px; }
  .lap-barra i { width: 11px; height: 11px; border-radius: 99px; display: block; }
  .lap-barra u { margin-left: 14px; width: 340px; height: 20px; border-radius: 6px; background: #fff; text-decoration: none; font-size: 12px; color: #828b98; display: flex; align-items: center; padding: 0 10px; }
  .lap-visor { position: absolute; top: 34px; left: 0; right: 0; bottom: 0; overflow: hidden; }
  .lap-base { position: absolute; left: 0; bottom: 0; width: 1000px; height: 24px; border-radius: 0 0 26px 26px; background: linear-gradient(#3a4352, #1a202b); }
  .lap-base::before { content: ''; position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: 150px; height: 9px; border-radius: 0 0 10px 10px; background: #11161f; }

  /* celular: 300 x 620 */
  .cel {
    width: 300px; height: 620px; border-radius: 48px; padding: 12px;
    background: linear-gradient(150deg, #2a3342, #0d121b);
    box-shadow: 0 0 0 2px rgba(255,255,255,.12) inset, 0 60px 100px -30px rgba(0,0,0,.85),
                0 0 90px -20px color-mix(in srgb, var(--tom) 60%, transparent);
  }
  .ilha { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); width: 96px; height: 26px; border-radius: 99px; background: #05070b; z-index: 3; }
  .tela-cel { position: relative; width: 276px; height: 596px; border-radius: 37px; overflow: hidden; background: #fff; }
  .rolo { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }

  /* -- site de computador (868 de largura) -- */
  .d-site { width: 868px; color: #1d2228; font-family: "DM Sans", sans-serif; }
  .d-nav { display: flex; align-items: center; gap: 26px; padding: 20px 40px; border-bottom: 1px solid #eef1f4; }
  .d-nav b { font-family: "Plus Jakarta Sans", sans-serif; font-weight: 800; font-size: 20px; margin-right: auto; }
  .d-nav span { font-size: 14px; color: #5b636d; }
  .d-nav em { font-style: normal; font-weight: 700; font-size: 13.5px; color: #fff; background: var(--tom); padding: 10px 18px; border-radius: 10px; }
  .d-hero { display: grid; grid-template-columns: 1.05fr .95fr; gap: 36px; align-items: center; padding: 40px 40px 30px; }
  .d-olho { font-size: 11.5px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--tom); }
  .d-tit { font-family: "Plus Jakarta Sans", sans-serif; font-weight: 800; font-size: 40px; line-height: 1.06; letter-spacing: -.03em; margin-top: 12px; }
  .d-sub { margin-top: 14px; font-size: 16px; line-height: 1.55; color: #5b636d; }
  .d-btns { margin-top: 22px; display: flex; gap: 10px; }
  .d-btn { font-weight: 700; font-size: 14.5px; color: #fff; background: var(--tom); padding: 13px 22px; border-radius: 12px; }
  .d-btn2 { font-weight: 700; font-size: 14.5px; color: #1d2228; background: #f1f3f6; padding: 13px 22px; border-radius: 12px; }
  .d-hero img { width: 100%; height: 300px; object-fit: cover; border-radius: 18px; display: block; }
  .d-sec { padding: 20px 40px 30px; }
  .d-rot { font-size: 11.5px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--tom); margin-bottom: 14px; }
  .d-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .d-card { border: 1px solid #eef1f4; border-radius: 14px; padding: 18px; }
  .d-card b { display: block; font-family: "Plus Jakarta Sans", sans-serif; font-size: 17px; }
  .d-card span { display: block; margin-top: 6px; font-size: 14px; color: #5b636d; }
  .d-band { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 14px; padding: 0 40px 30px; }
  .d-band img { width: 100%; height: 180px; object-fit: cover; border-radius: 14px; display: block; }
  .d-dep { background: #f5f7f9; border-radius: 14px; padding: 22px; font-size: 15px; line-height: 1.5; color: #3a414a; display: flex; flex-direction: column; justify-content: center; }
  .d-dep b { margin-top: 10px; font-size: 13px; color: #8a929c; font-weight: 500; }
  .d-zap { margin: 0 40px 26px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px; border-radius: 14px; background: #25D366; color: #fff; font-weight: 700; font-size: 16px; }
  .d-rod { padding: 22px 40px 28px; border-top: 1px solid #eef1f4; display: flex; justify-content: space-between; font-size: 13px; color: #8a929c; }

  /* -- site de celular (276 de largura) -- */
  .s-nav { display: flex; align-items: center; justify-content: space-between; padding: 46px 16px 12px; }
  .s-nav b { font-family: "Plus Jakarta Sans", sans-serif; font-weight: 800; font-size: 15px; color: #1d2228; }
  .s-nav i { width: 20px; height: 2px; background: #1d2228; box-shadow: 0 6px 0 #1d2228, 0 -6px 0 #1d2228; }
  .s-foto { width: 100%; height: 180px; object-fit: cover; display: block; }
  .s-hero { padding: 18px 16px 6px; }
  .s-tit { font-family: "Plus Jakarta Sans", sans-serif; font-weight: 800; font-size: 21px; line-height: 1.12; letter-spacing: -.02em; color: #1d2228; }
  .s-sub { margin-top: 9px; font-size: 13px; line-height: 1.5; color: #5b636d; }
  .s-btn { display: inline-block; margin-top: 14px; color: #fff; font-weight: 700; font-size: 13px; padding: 11px 18px; border-radius: 11px; background: var(--tom); }
  .s-sec { padding: 22px 16px 10px; }
  .s-rot { font-size: 10px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; color: var(--tom); margin-bottom: 10px; }
  .s-item { display: flex; justify-content: space-between; gap: 10px; padding: 11px 0; border-top: 1px solid #eef1f4; font-size: 13.5px; color: #3a414a; }
  .s-item b { color: #1d2228; }
  .s-galeria { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px 16px 0; }
  .s-galeria img { width: 100%; height: 96px; object-fit: cover; border-radius: 10px; display: block; }
  .s-dep { margin: 18px 16px 0; padding: 14px; border-radius: 14px; background: #f5f7f9; font-size: 12.5px; line-height: 1.5; color: #3a414a; }
  .s-dep b { display: block; margin-top: 6px; font-size: 11.5px; color: #8a929c; font-weight: 500; }
  .s-zap { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 18px 16px 0; padding: 13px; border-radius: 12px; background: #25D366; color: #fff; font-weight: 700; font-size: 13.5px; }
  .s-rod { padding: 20px 16px 30px; text-align: center; font-size: 11px; color: #8a929c; }

  /* -- Instagram (276 de largura) -- */
  .ig { width: 276px; color: #111; font-family: system-ui, -apple-system, "DM Sans", sans-serif; background: #fff; }
  .ig-cab { position: absolute; z-index: 2; left: 0; right: 0; top: 0; height: 88px; background: #fff; color: #111; font-family: system-ui, -apple-system, "DM Sans", sans-serif; }
  .ig-status { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 6px 24px 0 30px; }
  .ig-status b { font-size: 13px; font-weight: 700; }
  .ig-status span { display: flex; gap: 3px; align-items: flex-end; }
  .ig-status i { display: block; width: 3px; background: #111; border-radius: 1px; }
  .ig-status i:nth-child(1) { height: 5px; } .ig-status i:nth-child(2) { height: 7px; } .ig-status i:nth-child(3) { height: 9px; }
  .ig-visor { position: absolute; left: 0; right: 0; top: 88px; bottom: 0; overflow: hidden; background: #fff; }
  .ig-top { display: flex; align-items: center; justify-content: space-between; padding: 4px 14px 10px; }
  .ig-top b { font-size: 15.5px; font-weight: 700; }
  .ig-top span { display: flex; gap: 14px; color: #111; }
  .ig-perfil { display: flex; align-items: center; gap: 10px; padding: 6px 14px 10px; }
  .ig-av { flex: none; width: 76px; height: 76px; border-radius: 999px; padding: 3px; background: conic-gradient(#feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5, #feda75); }
  .ig-av i { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 999px; border: 3px solid #fff; background: var(--tom); color: #fff; font-style: normal; font-family: "Plus Jakarta Sans", sans-serif; font-weight: 800; font-size: 26px; }
  .ig-nums { flex: 1; display: flex; justify-content: space-around; text-align: center; }
  .ig-nums b { display: block; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ig-nums span { font-size: 11.5px; color: #333; }
  .ig-bio { padding: 0 14px; font-size: 12.5px; line-height: 1.42; }
  .ig-bio b { display: block; font-size: 13px; }
  .ig-bio .cat { display: block; color: #737373; }
  .ig-bio a { color: #00376b; font-weight: 600; text-decoration: none; }
  .ig-bts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; padding: 10px 14px; }
  .ig-bts span { text-align: center; font-size: 12.5px; font-weight: 600; padding: 7px 0; border-radius: 8px; background: #efefef; }
  .ig-bts .seg { background: #0095f6; color: #fff; }
  .ig-dest { display: flex; gap: 11px; padding: 4px 14px 12px; }
  .ig-dest div { text-align: center; width: 54px; }
  .ig-dest i { display: block; width: 54px; height: 54px; border-radius: 999px; border: 1px solid #dbdbdb; padding: 3px; }
  .ig-dest i b { display: block; width: 100%; height: 100%; border-radius: 999px; background: color-mix(in srgb, var(--tom) 30%, #fff) center / cover no-repeat; }
  .ig-dest span { display: block; margin-top: 4px; font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ig-abas { display: flex; border-top: 1px solid #efefef; }
  .ig-abas i { flex: 1; height: 40px; display: grid; place-items: center; color: #8e8e8e; }
  .ig-abas i.on { color: #111; box-shadow: inset 0 -1.5px 0 #111; }
  .ig-grade { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
  .ig-t { position: relative; aspect-ratio: 1; overflow: hidden; background: #eee; }
  .ig-t img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ig-t.arte { display: grid; place-items: center; padding: 8px; text-align: center; }
  .ig-t.arte span { font-family: "Plus Jakarta Sans", sans-serif; font-weight: 800; font-size: 12.5px; line-height: 1.15; letter-spacing: -.01em; }
  .ig-t.e0 { background: var(--tom); color: #fff; }
  .ig-t.e1 { background: #1d2228; color: var(--tom); }
  .ig-t.e2 { background: #f4efe8; color: #1d2228; }
  .ig-t.e2::after { content: ''; position: absolute; left: 50%; bottom: 12px; width: 22px; height: 3px; transform: translateX(-50%); background: var(--tom); border-radius: 2px; }
  .ig-curtir { position: absolute; left: 46px; top: 46px; width: 38px; height: 38px; margin: -19px 0 0 -19px; opacity: 0; pointer-events: none; filter: drop-shadow(0 4px 10px rgba(0,0,0,.35)); }

  /* ---------------------------------------------------------- pacote */
  .cartoes { display: grid; gap: 12px; margin-top: 26px; }
  .cartao {
    display: flex; gap: 16px; align-items: flex-start;
    background: linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
    border: 1px solid var(--linha); border-radius: 20px; padding: 18px;
  }
  .cartao .ic {
    flex: none; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center;
    background: color-mix(in srgb, var(--tom) 24%, transparent); color: #fff;
  }
  .cartao b { display: block; font-family: "Plus Jakarta Sans", sans-serif; font-size: 17px; color: #fff; margin-bottom: 4px; }
  .cartao span { font-size: 14.5px; line-height: 1.5; color: var(--txt-2); }

  /* ----------------------------------------------------------- preço */
  .preco-bloco { text-align: center; }
  .de { position: relative; display: inline-block; font-size: 22px; color: var(--txt-2); }
  .de .risco { position: absolute; left: -4px; right: -4px; top: 52%; height: 2.5px; background: var(--cta); transform-origin: left; transform: scaleX(0); }

    telas = r

    document.documentElement.style.setProperty('--tom', r ? r.tom : '#5E8CBA');
    elBarras.innerHTML = telas.map(function () { return '<i><b></b></i>'; }).join('');
    mostrar(0, 1);

  function mostrar(n, dir) {
    if (trocando) return;
    matarAnims();
    var velha = elTelas.querySelector('.tela.on');
    var nova = document.createElement('div');
    nova.className = 'tela';
    nova.innerHTML = telas[n].html;
    elTelas.appendChild(nova);
    encaixa(nova);

    var entra = function () {
      nova.classList.add('on');
      encaixa(nova);
      if (MOVE) G.fromTo(nova, { opacity: 0, x: 40 * dir }, { opacity: 1, x: 0, duration: .5, ease: 'power3.out' });
      telas[n].entrar(nova);
      trocando = false;
    };

    if (velha) {
      if (MOVE) {
        trocando = true;
        G.to(velha, { opacity: 0, x: -40 * dir, duration: .28, ease: 'power2.in', onComplete: function () { velha.remove(); entra(); } });
      } else { velha.remove(); entra(); }
    } else { entra(); }

    atual = n;
    [].forEach.call(elBarras.children, function (b, i) { b.classList.toggle('feita', i <= n); });
    bVoltar.disabled = (!ramo && n === 0);
    bAvancar.disabled = !ramo || n >= telas.length - 1;
    elDica.textContent = !ramo ? 'Toque no seu ramo' : (n >= telas.length - 1 ? '' : 'Toque para continuar');
  }

  function vai(d) {
    if (!ramo || trocando) return;
    var n = Math.max(0, Math.min(telas.length - 1, atual + d));
    if (n !== atual) mostrar(n, d);
  }

  function voltar() {
    if (trocando) return;
    if (ramo && atual === 0) { ramo = null; montar(); return; }
    vai(-1);
  }

  elTelas.addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (chip && !trocando) {
      ramo = chip.getAttribute('data-ramo');
      if (MOVE) {
        G.to(chip, { scale: 1.08, duration: .14, yoyo: true, repeat: 1, onComplete: montar });
      } else { montar(); }
      return;
    }
    if (e.target.closest('#recomecar')) { ramo = null; montar(); }
  });

  bAvancar.addEventListener('click', function () { vai(1); });
  bVoltar.addEventListener('click', voltar);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); vai(1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); voltar(); }
  });

  /* arrastar pro lado; 55px e ângulo pra não confundir com rolagem */
  var x0 = null, y0 = null;
  document.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.6) { if (dx < 0) vai(1); else voltar(); }
    x0 = y0 = null;
  }, { passive: true });

  // girou o celular ou mudou o tamanho da janela: reencaixa os aparelhos
  window.addEventListener('resize', function () { encaixa(elTelas.querySelector('.tela.on')); });

  // o brilho do fundo deriva devagar o tempo todo -- o palco nunca está parado
  if (MOVE) {
    G.to(brilho, { xPercent: 8, yPercent: -6, duration: 7, ease: 'sine.inOut', repeat: -1, yoyo: true });
  }

  montar();
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js')['catch'](function (e) { console.warn('[sw]', e); });
    });
  }
</script>
