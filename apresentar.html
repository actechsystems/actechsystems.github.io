      itens: [['Banho', 'R$ 60'], ['Tosa higiênica', 'R$ 45'], ['Leva e traz', 'no bairro']],
      dep: ['Buscam e trazem o Thor. Sai cheiroso e feliz.', 'André, tutor'],
      rodape: 'Seg a sáb, 8h às 18h · Leva e traz'
    },
    restaurante: {

      fotos: ['imgs/ramos/restaurante-1.webp', 'imgs/ramos/restaurante-2.webp'],
      busca: 'restaurante perto de mim',
      concorrentes: [['Sabor da Casa', '4,7', 812], ['Prato Cheio', '4,5', 497]],
      titulo: 'O cardápio de hoje, sempre atualizado.',
      sub: 'Cardápio online, pedido pelo WhatsApp e reserva de mesa.',
      cta: 'Ver o cardápio',
      itens: [['Prato do dia', 'R$ 32'], ['Marmita', 'R$ 25'], ['Reserva', 'sem taxa']],
      dep: ['Vejo o prato do dia antes de sair do trabalho. Ajuda demais.', 'Paulo, cliente'],
      rodape: 'Todo dia, 11h às 15h · Delivery no bairro'
    },
    clinica: {
      rotulo: 'Clínica', exemplo: 'Clínica Vida', tom: '#4FB8B1',
      fotos: ['imgs/ramos/clinica-1.webp', 'imgs/ramos/clinica-2.webp'],
      busca: 'clínica perto de mim',
      concorrentes: [['Clínica Saúde Mais', '4,7', 643], ['Centro Médico Bem-Estar', '4,5', 318]],
      titulo: 'Consulta marcada sem ligar pra ninguém.',
      sub: 'Agenda online, convênios na primeira tela e lembrete automático.',
      cta: 'Marcar consulta',
      itens: [['Consulta', 'particular e convênio'], ['Retorno', 'em 30 dias'], ['Exames', 'no local']],
      dep: ['Marquei a consulta da minha mãe em um minuto, pelo celular.', 'Renata, paciente'],
      rodape: 'Seg a sex, 8h às 18h · Convênios aceitos'
    },
    outro: {
      rotulo: 'Outro', exemplo: 'Seu negócio', tom: '#5E8CBA',
      fotos: ['imgs/ramos/outro-1.webp', 'imgs/ramos/outro-2.webp'],
      busca: 'o seu serviço perto de mim',
      concorrentes: [['Concorrente A', '4,7', 290], ['Concorrente B', '4,5', 146]],
      titulo: 'Seu trabalho, achado por quem procura.',
      sub: 'Site, WhatsApp e ficha do Google trabalhando juntos.',
      cta: 'Falar com a gente',
      itens: [['Serviços', 'com preço claro'], ['Contato', 'num toque'], ['Google', 'ficha completa']],
      dep: ['Achei pelo Google e já chamei no WhatsApp na hora.', 'Cliente'],
      rodape: 'Atendimento em Brasília e entorno'
    }
  };
  var ORDEM = ['roupa', 'barbearia', 'salao', 'maquiagem', 'mercado', 'petshop', 'restaurante', 'clinica', 'outro'];

  var elTelas = document.getElementById('telas');
  var elBarras = document.getElementById('barras');
  var elDica = document.getElementById('dica');
  var bVoltar = document.getElementById('voltar');
  var bAvancar = document.getElementById('avancar');
  var brilho = document.getElementById('brilho');

  var ramo = null;
  var atual = 0;
  var telas = [];
  var animsVivas = [];
  var trocando = false;

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function zap(t) { return 'https://wa.me/' + WHATS + '?text=' + encodeURIComponent(t); }

  function palavras(txt) {
    return String(txt).split(' ').map(function (p) {
      return '<span class="palavra"><span>' + esc(p) + '</span></span>';
    }).join(' ');
  }

  function matarAnims() {
    animsVivas.forEach(function (a) { if (a && a.kill) a.kill(); });
    animsVivas = [];
  }
  function anim(a) { animsVivas.push(a); return a; }
  function sobe(el, sel, extra) {
    return G.from(el.querySelectorAll(sel), Object.assign({ yPercent: 110, duration: .7, stagger: .07, ease: 'power4.out' }, extra || {}));
  }

  /* ============================================================ TELAS */

  function telaCapa() {
    return {
      html:
        '<div class="conteudo capa">' +
          '<div class="logo-grande" data-a="logo">' +
            '<svg width="36" height="36" viewBox="0 0 32 32" aria-hidden="true"><path d="M12 10l-6 6 6 6M20 10l6 6-6 6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          '</div>' +
          '<h1 data-a="titulo">' + palavras('Qual é o seu negócio?') + '</h1>' +
          '<p class="sub" data-a="sub">Em dois toques eu te mostro como ficaria o seu site.</p>' +
          '<div class="chips">' +
            ORDEM.map(function (k) {
              return '<button class="chip" data-ramo="' + k + '">' + esc(RAMOS[k].rotulo) + '</button>';
            }).join('') +
          '</div>' +
        '</div>',
      entrar: function (el) {
        if (!MOVE) return;
        var tl = anim(G.timeline());
        tl.from(el.querySelector('[data-a=logo]'), { scale: .4, rotate: -25, opacity: 0, duration: .8, ease: 'back.out(1.8)' })
          .add(sobe(el, '[data-a=titulo] .palavra > span'), '-=.45')
          .from(el.querySelector('[data-a=sub]'), { y: 14, opacity: 0, duration: .5 }, '-=.35')
          .from(el.querySelectorAll('.chip'), { y: 26, opacity: 0, scale: .9, duration: .5, stagger: .055, ease: 'back.out(1.6)' }, '-=.2');
      }
    };
  }

  function telaBusca(r) {
    return {
      html:
        '<div class="duas">' +
          '<div>' +
            '<div class="olho">O que acontece hoje</div>' +
            '<h2 data-a="titulo">' + palavras('Seu cliente procura no Google.') + '</h2>' +
            '<p class="sub" data-a="sub">Ele vê os primeiros nomes e liga pra um deles. <strong>Quem não aparece nem fica sabendo que perdeu o cliente.</strong></p>' +
          '</div>' +
          '<div>' +
            '<div class="busca-caixa" data-a="caixa">' +
              '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>' +
              '<span><span data-a="digitado"></span><span class="cursor-pisca"></span></span>' +
            '</div>' +
            '<div class="resultados">' +
              r.concorrentes.map(function (c, n) {
                return '<div class="resultado" data-a="res">' +
                  '<span class="num">' + (n + 1) + '</span>' +
                  '<div><b>' + esc(c[0]) + '</b><small><span class="estrelas">★★★★★</span> ' + c[1] + ' · ' + c[2] + ' avaliações</small></div>' +
                '</div>';
              }).join('') +
              '<div class="voce-nao" data-a="nao">E você? Não está aqui.</div>' +
            '</div>' +
          '</div>' +
        '</div>',
      entrar: function (el) {
        var alvo = el.querySelector('[data-a=digitado]');
        var txt = r.busca;
        if (!MOVE) { alvo.textContent = txt; return; }
        var tl = anim(G.timeline());
        tl.add(sobe(el, '[data-a=titulo] .palavra > span', { stagger: .06 }))
          .from(el.querySelector('[data-a=sub]'), { y: 14, opacity: 0, duration: .5 }, '-=.4')
          .from(el.querySelector('[data-a=caixa]'), { y: 30, opacity: 0, scale: .95, duration: .6, ease: 'power3.out' }, '-=.5')
          .set(el.querySelectorAll('[data-a=res], [data-a=nao]'), { opacity: 0 });

        // a busca se digitando, letra por letra
        var obj = { n: 0 };
        tl.to(obj, {
          n: txt.length, duration: txt.length * 0.055, ease: 'none',
          onUpdate: function () { alvo.textContent = txt.slice(0, Math.round(obj.n)); }
        }, '+=.15');

        tl.fromTo(el.querySelectorAll('[data-a=res]'), { y: 34, opacity: 0 }, { y: 0, opacity: 1, duration: .5, stagger: .22, ease: 'power3.out' }, '+=.25')
          .fromTo(el.querySelector('[data-a=nao]'), { scale: .7, opacity: 0 }, { scale: 1, opacity: 1, duration: .6, ease: 'back.out(2.2)' }, '+=.35')
          .to(el.querySelector('[data-a=nao]'), { x: -7, duration: .07, repeat: 5, yoyo: true, ease: 'none' })
          .set(el.querySelector('[data-a=nao]'), { x: 0 });
      }
    };
  }

  function telaSite(r) {
    var site =
      '<div class="s-nav"><b>' + esc(r.exemplo) + '</b><i></i></div>' +
      '<img class="s-foto" src="' + esc(r.fotos[0]) + '" alt="">' +
      '<div class="s-hero">' +
        '<div class="s-tit">' + esc(r.titulo) + '</div>' +
        '<div class="s-sub">' + esc(r.sub) + '</div>' +
        '<span class="s-btn">' + esc(r.cta) + '</span>' +
      '</div>' +
      '<div class="s-sec">' +
        '<div class="s-rot">O que oferecemos</div>' +
        r.itens.map(function (it) { return '<div class="s-item"><b>' + esc(it[0]) + '</b><span>' + esc(it[1]) + '</span></div>'; }).join('') +
      '</div>' +
      '<div class="s-galeria"><img src="' + esc(r.fotos[1]) + '" alt=""><img src="' + esc(r.fotos[0]) + '" alt=""></div>' +
      '<div class="s-dep">“' + esc(r.dep[0]) + '”<b>' + esc(r.dep[1]) + '</b></div>' +
      '<div class="s-zap"><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2z"/></svg> Falar no WhatsApp</div>' +
      '<div class="s-rod">' + esc(r.rodape) + '</div>';

    return {
      html:
        '<div class="duas">' +
          '<div>' +
            '<div class="olho">Como ficaria o seu</div>' +
            '<h2 data-a="titulo">' + palavras(r.exemplo + ',') + ' <span class="destaque">' + palavras('no ar.') + '</span></h2>' +
            '<p class="sub" data-a="sub">Esse é um exemplo. <strong>O seu sai com o seu nome, as suas fotos e os seus preços</strong> — no celular e no computador.</p>' +
          '</div>' +
          '<div class="celular-palco">' +
            '<div class="celular" data-a="cel">' +
              '<div class="ilha"></div>' +
              '<div class="tela-cel"><div class="rolo" data-a="rolo">' + site + '</div></div>' +
            '</div>' +
          '</div>' +
        '</div>',
      entrar: function (el) {
        var cel = el.querySelector('[data-a=cel]');
        var rolo = el.querySelector('[data-a=rolo]');
        var visor = rolo.parentElement;
        if (!MOVE) return;

        var tl = anim(G.timeline());
        tl.add(sobe(el, '[data-a=titulo] .palavra > span'))
          .from(el.querySelector('[data-a=sub]'), { y: 14, opacity: 0, duration: .5 }, '-=.4')
          // o celular entra girando em 3D e assenta
          .from(cel, { rotateY: -38, rotateX: 14, y: 120, opacity: 0, scale: .82, duration: 1.15, ease: 'power3.out' }, '-=.7');

        // e o site rola sozinho lá dentro, ida e volta, mostrando a página inteira
        tl.add(function () {
          var dist = Math.max(0, rolo.scrollHeight - visor.clientHeight);
          anim(G.to(rolo, { y: -dist, duration: Math.max(4, dist / 85), ease: 'sine.inOut', repeat: -1, yoyo: true, repeatDelay: 1.1 }));
          anim(G.to(cel, { rotateY: 6, rotateX: -3, duration: 3.2, ease: 'sine.inOut', repeat: -1, yoyo: true }));
        }, '+=.5');
      }
    };
  }

  function telaPacote() {
    var ic = {
      site: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 8h18M8 21h8"/></svg>',
      redes: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg>',
      google: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>'
    };
    return {
      html:
        '<div class="conteudo">' +
          '<div class="olho">O que entra</div>' +
          '<h2 data-a="titulo">' + palavras('Não é só o site.') + '</h2>' +
          '<div class="cartoes">' +
            '<div class="cartao" data-a="c"><div class="ic">' + ic.site + '</div><div><b>O site no ar</b><span>Endereço próprio, no celular e no computador. Pronto em até 5 dias.</span></div></div>' +
            '<div class="cartao" data-a="c"><div class="ic">' + ic.redes + '</div><div><b>Suas redes publicando</b><span>8 posts por mês. A gente cria a arte e publica — você não precisa lembrar.</span></div></div>' +
            '<div class="cartao" data-a="c"><div class="ic">' + ic.google + '</div><div><b>Sua ficha do Google</b><span>Foto, horário, telefone e avaliação respondida. É o que aparece na busca.</span></div></div>' +
          '</div>' +
        '</div>',
      entrar: function (el) {
        if (!MOVE) return;
        var tl = anim(G.timeline());
        tl.add(sobe(el, '[data-a=titulo] .palavra > span'))
          .from(el.querySelectorAll('[data-a=c]'), { x: -60, opacity: 0, duration: .65, stagger: .18, ease: 'power3.out' }, '-=.3')
          .from(el.querySelectorAll('[data-a=c] .ic'), { scale: 0, rotate: -90, duration: .55, stagger: .18, ease: 'back.out(2)' }, '-=.85');
      }
    };
  }

  function telaPreco() {
    return {
      html:
        '<div class="conteudo preco-bloco">' +
          '<div class="olho">Quanto custa</div>' +
          '<div><span class="de" data-a="de">' + PRECO_DE + '<span class="risco" data-a="risco"></span></span></div>' +
          '<div class="valor">R$ <span data-a="num">359</span><small>,<span data-a="cent">99</span></small></div>' +
          '<div class="mes" data-a="mes">por mês</div>' +
          '<div class="selos">' +
            '<span class="selo forte" data-a="selo">1º mês grátis</span>' +
            '<span class="selo" data-a="selo">Sem fidelidade</span>' +
            '<span class="selo" data-a="selo">Sem taxa de setup</span>' +
          '</div>' +
          '<p class="sub" data-a="sub">Você só paga no segundo mês. <strong>Se não gostar, cancela e não deve nada.</strong></p>' +
        '</div>',
      entrar: function (el) {
        var num = el.querySelector('[data-a=num]');
        var cent = el.querySelector('[data-a=cent]');
        var risco = el.querySelector('[data-a=risco]');
        if (!MOVE) { risco.style.transform = 'scaleX(1)'; return; }
        var tl = anim(G.timeline());
        var obj = { v: 0 };
        num.textContent = '0'; cent.textContent = '00';

        tl.from(el.querySelector('[data-a=de]'), { y: 16, opacity: 0, duration: .45 })
          .to(risco, { scaleX: 1, duration: .45, ease: 'power2.inOut' })
          // o preço conta de zero até o valor -- número que aparece pronto não pesa
          .to(obj, {
            v: PRECO, duration: 1.5, ease: 'power3.out',
            onUpdate: function () {
              var inteiro = Math.floor(obj.v);
              num.textContent = inteiro;
              cent.textContent = String(Math.min(99, Math.round((obj.v - inteiro) * 100))).padStart(2, '0');
            },
            onComplete: function () { num.textContent = '359'; cent.textContent = '99'; }
          }, '-=.1')
          .from(el.querySelector('[data-a=mes]'), { opacity: 0, duration: .35 }, '-=.6')
          .from(el.querySelectorAll('[data-a=selo]'), { scale: 0, opacity: 0, duration: .5, stagger: .14, ease: 'back.out(2.4)' }, '-=.2')
          .from(el.querySelector('[data-a=sub]'), { y: 14, opacity: 0, duration: .45 }, '-=.1');
      }
    };
  }

  function telaFechar(r) {
    var msg = 'Olá! Tenho um negócio de ' + r.rotulo.toLowerCase() + ' e quero o site da ACTech.';
    return {
      html:
        '<div class="conteudo">' +
          '<div class="olho">Como começa</div>' +
          '<h2 data-a="titulo">' + palavras('Hoje você só me manda') + ' <span class="destaque">' + palavras('o material.') + '</span></h2>' +
          '<div class="passos">' +
            '<div class="passo" data-a="p"><i>1</i>Logo e fotos pelo WhatsApp, do jeito que tiver</div>' +
            '<div class="passo" data-a="p"><i>2</i>Em até 5 dias o site está pronto</div>' +
            '<div class="passo" data-a="p"><i>3</i>O primeiro mês é por nossa conta</div>' +
          '</div>' +
          '<div class="acoes">' +
            '<a class="btn btn-cta" data-a="b" href="' + ASSINAR + '" target="_blank" rel="noopener">Começar agora</a>' +
            '<a class="btn btn-sec" data-a="b" href="' + zap(msg) + '" target="_blank" rel="noopener">Mandar material no WhatsApp</a>' +
          '</div>' +
          '<button class="mini-link" id="recomecar">Apresentar para outro negócio</button>' +
        '</div>',
      entrar: function (el) {
        if (!MOVE) return;
        var tl = anim(G.timeline());
        tl.add(sobe(el, '[data-a=titulo] .palavra > span', { stagger: .06 }))
          .from(el.querySelectorAll('[data-a=p]'), { x: -40, opacity: 0, duration: .5, stagger: .14, ease: 'power3.out' }, '-=.3')
          .from(el.querySelectorAll('[data-a=b]'), { y: 30, opacity: 0, duration: .55, stagger: .12, ease: 'back.out(1.6)' }, '-=.1');
      }
    };
  }

  /* ============================================================ MOTOR */

  function montar() {
    var r = ramo ? RAMOS[ramo] : null;
    telas = r
      ? [telaBusca(r), telaSite(r), telaPacote(), telaPreco(), telaFechar(r)]
      : [telaCapa()];
    document.documentElement.style.setProperty('--tom', r ? r.tom : '#5E8CBA');
    elBarras.innerHTML = telas.map(function () { return '<i><b></b></i>'; }).join('');
    mostrar(0, 1);
  }

  function mostrar(n, dir) {
    if (trocando) return;
    matarAnims();
    var velha = elTelas.querySelector('.tela.on');
    var nova = document.createElement('div');
    nova.className = 'tela';
    nova.innerHTML = telas[n].html;
    elTelas.appendChild(nova);

    var entra = function () {
      nova.classList.add('on');
      if (MOVE) G.fromTo(nova, { opacity: 0, x: 40 * dir }, { opacity: 1, x: 0, duration: .5, ease: 'power3.out' });
      telas[n].entrar(nova);
      trocando = false;
    };

    if (velha) {
      if (MOVE) {
        trocando = true;
        G.to(velha, { opacity: 0, x: -40 * dir, duration: .28, ease: 'power2.in', onComplete: function () { velha.remove(); entra(); } });
      } else { velha.remove(); entra(); }
    } else { entra(); }

    atual = n;
    [].forEach.call(elBarras.children, function (b, i) { b.classList.toggle('feita', i <= n); });
    bVoltar.disabled = (!ramo && n === 0);
    bAvancar.disabled = !ramo || n >= telas.length - 1;
    elDica.textContent = !ramo ? 'Toque no seu ramo' : (n >= telas.length - 1 ? '' : 'Toque para continuar');
  }

  function vai(d) {
    if (!ramo || trocando) return;
    var n = Math.max(0, Math.min(telas.length - 1, atual + d));
    if (n !== atual) mostrar(n, d);
  }

  function voltar() {
    if (trocando) return;
    if (ramo && atual === 0) { ramo = null; montar(); return; }
    vai(-1);
  }

  elTelas.addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (chip && !trocando) {
      ramo = chip.getAttribute('data-ramo');
      if (MOVE) {
        G.to(chip, { scale: 1.08, duration: .14, yoyo: true, repeat: 1, onComplete: montar });
      } else { montar(); }
      return;
    }
    if (e.target.closest('#recomecar')) { ramo = null; montar(); }
  });

  bAvancar.addEventListener('click', function () { vai(1); });
  bVoltar.addEventListener('click', voltar);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); vai(1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); voltar(); }
  });

  /* arrastar pro lado; 55px e ângulo pra não confundir com rolagem */
  var x0 = null, y0 = null;
  document.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.6) { if (dx < 0) vai(1); else voltar(); }
    x0 = y0 = null;
  }, { passive: true });

  // o brilho do fundo deriva devagar o tempo todo -- o palco nunca está parado
  if (MOVE) {
    G.to(brilho, { xPercent: 8, yPercent: -6, duration: 7, ease: 'sine.inOut', repeat: -1, yoyo: true });
  }

  montar();
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js')['catch'](function (e) { console.warn('[sw]', e); });
    });
  }
</script>
