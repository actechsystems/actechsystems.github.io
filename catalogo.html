<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Exemplo aberto pelo QR da previa de site: nao e pagina de ninguem, entao
     fica fora do Google. -->
<meta name="robots" content="noindex, nofollow">
<title>Cardápio digital · exemplo ACTech</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='8'%20fill='%23E0E5EC'/%3E%3Cpath%20d='M12%2011l-5%205%205%205M20%2011l5%205-5%205'%20fill='none'%20stroke='%233D6A99'%20stroke-width='3'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
  /* ============================================================
     Cardapio / catalogo digital de exemplo.
     Aberto pelo QR da previa (#modelos): le ?n=&r=&c=&o=&e= -- os mesmos
     parametros do link de compartilhar -- e pinta a pagina com as cores do
     estilo escolhido. Os itens vem de estilos/estilos.js (RAMOS) mais os
     extras de ITENS_EXTRAS aqui embaixo.
     ============================================================ */
  * { box-sizing: border-box; }
  :root { --bg: #fff; --fg: #111; --ac: #3d6a99; --na-ac: #fff; --fonte: system-ui; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: #f4f4f6; color: #1f2329; font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding-bottom: 96px; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .topo { position: relative; background: var(--bg); color: var(--fg); padding: 22px 18px 20px; overflow: hidden; }
  .topo-foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .28; }
  .topo > * { position: relative; }
  .marca { display: flex; align-items: center; gap: 12px; }
  .marca i { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 16px; background: var(--ac); color: var(--na-ac); font: 700 22px/1 var(--fonte), system-ui; font-style: normal; flex: none; }
  .marca h1 { margin: 0; font: 700 22px/1.15 var(--fonte), system-ui; letter-spacing: -.01em; }
  .marca small { display: block; margin-top: 3px; opacity: .8; font-size: 13.5px; }
  .aberto { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; font-size: 13px; font-weight: 600; padding: 5px 11px; border-radius: 99px; background: rgba(255,255,255,.88); color: #1b7a3b; }
  .aberto::before { content: ''; width: 7px; height: 7px; border-radius: 99px; background: currentColor; }
  .abas { position: sticky; top: 0; z-index: 3; display: flex; gap: 8px; padding: 12px 14px; background: #f4f4f6; overflow-x: auto; scrollbar-width: none; }
  .abas a { flex: none; padding: 8px 14px; border-radius: 99px; background: #fff; color: #1f2329; text-decoration: none; font-weight: 600; font-size: 13.5px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .abas a:first-child { background: var(--ac); color: var(--na-ac); }
  section { padding: 6px 14px 4px; }
  h2 { margin: 12px 4px 10px; font: 700 18px/1.2 var(--fonte), system-ui; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; background: #fff; border-radius: 16px; padding: 14px 14px 14px 16px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .item b { font-size: 15.5px; }
  .item p { grid-column: 1; margin: 0; color: #5c6370; font-size: 13.5px; }
  .item .preco { grid-column: 1; font-weight: 700; color: #1f2329; }
  .item .preco small { font-weight: 500; color: #7a818c; }
  .mais { grid-column: 2; grid-row: 1 / span 3; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--ac); color: var(--na-ac); font-size: 22px; font-weight: 500; transition: transform .15s; }
  .mais:active { transform: scale(.9); }
  .qtd { grid-column: 2; grid-row: 1 / span 3; align-self: end; margin-bottom: -6px; font-size: 12px; font-weight: 700; color: var(--ac); text-align: center; }
  .dif { display: grid; gap: 10px; }
  .dif div { background: #fff; border-radius: 16px; padding: 14px 16px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .dif b { display: block; }
  .dif span { color: #5c6370; font-size: 13.5px; }
  .pe { padding: 22px 18px 10px; text-align: center; color: #7a818c; font-size: 12.5px; }
  .pe a { color: #3d6a99; font-weight: 700; }
  .barra { position: fixed; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 5; display: none; justify-content: space-between; align-items: center; padding: 14px 18px; border-radius: 16px; background: var(--ac); color: var(--na-ac); font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .barra.is-on { display: flex; }
  .aviso { position: fixed; left: 16px; right: 16px; bottom: 90px; z-index: 6; padding: 14px 16px; border-radius: 14px; background: #1f2329; color: #fff; font-size: 14px; text-align: center; opacity: 0; transform: translateY(10px); transition: opacity .3s, transform .3s; pointer-events: none; }
  .aviso.is-on { opacity: 1; transform: none; }
  .selo { margin: 10px 14px 0; padding: 10px 14px; border-radius: 12px; background: #fff7e0; color: #6f4e05; font-size: 12.5px; text-align: center; }
  @media (min-width: 640px) { body { max-width: 560px; margin: 0 auto; box-shadow: 0 0 0 1px #e3e3e8; } }
</style>
</head>
<body>
<div class="selo">Exemplo montado pela ACTech. Os itens e preços são ilustrativos.</div>
<header class="topo" id="topo"></header>
<nav class="abas" id="abas"></nav>
<main id="lista"></main>
<p class="pe">Cardápio digital de exemplo &middot; <a href="./#modelos">Feito na ACTech: monte o seu</a></p>
<button type="button" class="barra" id="barra"></button>
<div class="aviso" id="aviso" role="status"></div>

<script src="./estilos/estilos.js"></script>
<script>
(function () {
  'use strict';
  // mais itens por ramo, alem dos quatro servicos da previa
  var ITENS_EXTRAS = {
    barbearia: [['Pigmentação da barba', 'Cobre as falhas, efeito natural.', 40], ['Pomada modeladora', 'Efeito seco, fixação forte.', 39], ['Óleo para barba', 'Hidrata e perfuma.', 32]],
    salao: [['Hidratação', 'Máscara com vapor.', 90], ['Design de sobrancelha', 'Com henna.', 45], ['Pé e mão', 'Esmaltação em gel.', 70]],
    petshop: [['Hidratação de pelo', 'Brilho e maciez.', 35], ['Ração 15 kg', 'Adulto, raças médias.', 189], ['Antipulgas', 'Dose para 30 dias.', 64]],
    clinica: [['Retorno', 'Em até 30 dias.', 60], ['Eletrocardiograma', 'Com laudo.', 120], ['Atestado de saúde', 'Para academia ou trabalho.', 90]],
    restaurante: [['Suco natural', 'Laranja, limão ou maracujá.', 10], ['Refrigerante lata', '350 ml.', 7], ['Porção de batata', 'Serve duas pessoas.', 28]],
    mercado: [['Café 500 g', 'Torra tradicional.', 18], ['Leite 1 L', 'Integral.', 5], ['Pão francês', 'O quilo, saindo agora.', 16]],
    outro: [['Visita técnica', 'Avaliação no local.', 90], ['Peça de reposição', 'Original, com garantia.', 75], ['Manutenção preventiva', 'A cada seis meses.', 240]]
  };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var fmt = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  function preco(t) { var n = parseFloat(String(t).replace(/[^\d,]/g, '').replace(',', '.')); return isFinite(n) ? n : null; }
  function claro(hex) { var h = hex.replace('#', ''); if (h.length !== 6) return true; var r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16); return (r * 299 + g * 587 + b * 114) / 1000 > 150; }

  var E = window.ACTechEstilos || { ramos: {}, estilos: [] };
  var q = new URLSearchParams(location.search);
  var ramoId = E.ramos[q.get('r')] ? q.get('r') : 'restaurante';
  var R = E.ramos[ramoId];
  var nome = (q.get('n') || R.exemplo).slice(0, 30);
  var cidade = (q.get('c') || '').slice(0, 30);
  var est = E.estilos.filter(function (x) { return x.id === q.get('e'); })[0] || E.estilos[0];
  var a = est ? est.amostra : { bg: '#fff', fg: '#111', ac: '#3d6a99', fonte: 'system-ui' };
  var raiz = document.documentElement.style;
  raiz.setProperty('--bg', a.bg); raiz.setProperty('--fg', a.fg); raiz.setProperty('--ac', a.ac);
  raiz.setProperty('--na-ac', claro(a.ac) ? '#111' : '#fff'); raiz.setProperty('--fonte', a.fonte);
  if (E.fontes) { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = E.fontes; document.head.appendChild(l); }
  var eCardapio = ramoId === 'restaurante';
  var titulo = eCardapio ? 'Cardápio' : ramoId === 'mercado' ? 'Ofertas' : 'Serviços e preços';
  document.title = titulo + ' · ' + nome;

  document.getElementById('topo').innerHTML =
    (R.foto ? '<img class="topo-foto" src="' + R.foto + '" alt="" />' : '') +
    '<div class="marca"><i>' + esc(nome.trim()[0] || 'A').toUpperCase() + '</i><div><h1>' + esc(nome) + '</h1><small>' + esc(q.get('o') || R.rotulo) + (cidade ? ' · ' + esc(cidade) : '') + '</small></div></div>' +
    '<span class="aberto">Aberto agora · até 19h</span>';

  var itens = R.servicos.map(function (s) { return { nome: s[0], desc: s[1], preco: preco(s[2]), detalhe: s[3] }; })
    .concat(ITENS_EXTRAS[ramoId].map(function (s) { return { nome: s[0], desc: s[1], preco: s[2], detalhe: '' }; }));
  var grupos = [['Mais pedidos', itens.slice(0, 4)], ['Também tem', itens.slice(4)]];
  document.getElementById('abas').innerHTML = grupos.map(function (g, i) { return '<a href="#g' + i + '">' + g[0] + '</a>'; }).join('') + '<a href="#g2">Por que a gente</a>';
  document.getElementById('lista').innerHTML = grupos.map(function (g, gi) {
    return '<section id="g' + gi + '"><h2>' + g[0] + '</h2>' + g[1].map(function (it, i) {
      var k = gi * 10 + i;
      return '<div class="item"><b>' + esc(it.nome) + '</b><p>' + esc(it.desc) + '</p>' +
        '<span class="preco">' + (it.preco != null ? fmt.format(it.preco) : esc(R.servicos[i] ? R.servicos[i][2] : '')) + (it.detalhe ? ' <small>· ' + esc(it.detalhe) + '</small>' : '') + '</span>' +
        (it.preco != null ? '<button type="button" class="mais" data-k="' + k + '" aria-label="Pôr ' + esc(it.nome) + ' no pedido">+</button><span class="qtd" data-q="' + k + '"></span>' : '') + '</div>';
    }).join('') + '</section>';
  }).join('') + '<section id="g2"><h2>Por que a gente</h2><div class="dif">' + R.dif.map(function (d) { return '<div><b>' + esc(d[0]) + '</b><span>' + esc(d[1]) + '</span></div>'; }).join('') + '</div></section>';

  var pedido = {};
  var todos = {}; grupos.forEach(function (g, gi) { g[1].forEach(function (it, i) { todos[gi * 10 + i] = it; }); });
  var barra = document.getElementById('barra'), aviso = document.getElementById('aviso'), t;
  function avisa(txt) { aviso.textContent = txt; aviso.classList.add('is-on'); clearTimeout(t); t = setTimeout(function () { aviso.classList.remove('is-on'); }, 3200); }
  function atualiza() {
    var n = 0, total = 0;
    for (var k in pedido) { n += pedido[k]; total += pedido[k] * todos[k].preco; var el = document.querySelector('[data-q="' + k + '"]'); if (el) el.textContent = pedido[k] + 'x'; }
    barra.classList.toggle('is-on', n > 0);
    barra.innerHTML = '<span>' + (eCardapio ? 'Fazer pedido' : 'Pedir no WhatsApp') + ' (' + n + ')</span><span>' + fmt.format(total) + '</span>';
  }
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-k]');
    if (b) { pedido[b.dataset.k] = (pedido[b.dataset.k] || 0) + 1; atualiza(); return; }
    if (ev.target.closest('#barra')) avisa('No de verdade, o pedido chega montado no WhatsApp de ' + nome + '. Aqui é só exemplo.');
  });
})();
</script>
</body>
</html>
